    <style>
  /* --- 1. RESETEO Y CONFIGURACIÓN BASE --- */
* { 
  margin: 0; 
  padding: 0;
  border: 0; 
  box-sizing: border-box; 
}

/* Barra de scroll horizontal visible y estilizada */
.wrapper::-webkit-scrollbar { 
  height: 8px; /* Grosor de la barra horizontal */
  background: #111; /* Fondo del riel */
}

.wrapper::-webkit-scrollbar-thumb { 
  background: red; /* Color del indicador de la barra */
  border-radius: 4px; 
}

.wrapper::-webkit-scrollbar-thumb:hover { 
  background: #b30000; /* Color al pasar el cursor */
}

body { 
  font-weight: 500; 
  background: black; 
  color: red; 
  overflow: hidden; /* Evita scrolls duplicados en el navegador */
}

.wrapper { 
  max-width: 100%; 
  height: 100vh; /* Ocupa todo el alto de la pantalla */
  margin: 0 auto; 
  padding: 32px; 
  overflow-y: scroll; /* Mantiene el scroll que la rotación convierte en horizontal */
}

.title_fansly { 
  font-size: 70px; 
  color: white; 
  text-align: center; 
  font-family: "Audiowide", sans-serif; 
  font-weight: 400; 
  margin-top: 100px; 
  font-style: normal; 
}

/* --- 2. CONTENEDOR FLIPPED (SCROLL HORIZONTAL) --- */
.horizontal-scroll-wrapper { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  width: 100vh; 
  transform: rotate(-90deg) translate3d(0,-100vh,0); 
  transform-origin: right top; 
  padding: 0 0 10rem 0; 
  height: 50vw; 
  transform-style: preserve-3d; 
}

/* --- 3. CONTENEDORES DE IMAGEN Y EFECTO HOVER --- */
.img-wrapper { 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  min-height: 40vh; 
  transform-origin: 50% 50%; 
  transform: rotate(90deg) translateZ(.1px) scale(0.9) translate(0px, -3vh); 
  transition: min-height 1s; 
}

.img-wrapper:hover { 
  min-height: 65vh; 
}

.img-wrapper a { 
  overflow: hidden; 
  display: block; 
  padding: 1vh; 
  background: linear-gradient(90deg, rgba(137,8,191,1) 0%, rgba(121,9,43,1) 35%, rgba(0,212,255,1) 100%); 
  box-shadow: 0 10px 50px #5f2f1182; 
}

img { 
  max-width: 45vh; 
  max-height: 50vh; 
  transition: .5s; 
  vertical-align: top; 
  filter: saturate(40%) sepia(30%) hue-rotate(5deg); 
}

a:hover img { 
  filter: none; 
}

/* --- 4. CLASES DE VELOCIDAD PARALAJE --- */
.slower      { transform: rotate(90deg) translateZ(-.2px)  scale(1.1)  translate(0%, -10vh); }
.slower1     { transform: rotate(90deg) translateZ(-.25px) scale(1.05) translate(0%, 8vh); }
.slower2     { transform: rotate(90deg) translateZ(-.3px)  scale(1.3)  translate(0%, 2vh); }
.slower-down { transform: rotate(90deg) translateZ(-.2px)  scale(1.1)  translate(0%, 16vh); }
.faster      { transform: rotate(90deg) translateZ(.15px)  scale(0.8)  translate(0%, 14vh); }
.faster1     { transform: rotate(90deg) translateZ(.05px)  scale(0.8)  translate(0%, 10vh); }
.fastest     { transform: rotate(90deg) translateZ(.22px)  scale(0.7)  translate(-10vh, -15vh); }
.vertical    { transform: rotate(90deg) translateZ(-.15px) scale(1.15) translate(0%, 0%); }
.last        { transform: rotate(90deg) translateZ(-.2px)  scale(1.1)  translate(25vh, -8vh); }

/* --- 5. COMPONENTES DE INTERFAZ --- */
a { 
  color: inherit; 
  font-weight: 500; 
}

h1 { 
  font-weight: 300; 
  font-size: 1rem; 
}

p { 
  margin: 0; 
}

.icon svg { 
  width: 50px; 
  fill: currentColor; 
}

.btn_1 { 
  text-align: center; 
  padding-top: 20px; 
}

.boton { 
  text-shadow: 0px 1px rgba(0, 0, 0, 0.2); 
  text-align: center; 
  text-decoration: none; 
  font-family: 'Helvetica Neue', Helvetica, sans-serif; 
  display: inline-block; 
  color: #FFF; 
  background: #7F8C8D; 
  padding: 12px 60px; 
  white-space: nowrap; 
  border-radius: 5px; 
  margin: 10px 5px; 
  transition: all 0.2s ease-in-out; 
}

.azul { 
  background: linear-gradient(90deg, rgba(63,94,251,1) 0%, rgba(252,70,107,1) 100%);

}

.azul:hover { 
  background: linear-gradient(90deg, rgba(47,59,122,1) 0%, rgba(255,0,52,1) 100%); 
}

/* --- 6. RESPONSIVE --- */
