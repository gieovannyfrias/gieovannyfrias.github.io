    <style>
    /* ==========================================================================
   1. VARIABLES Y CONFIGURACIÓN GENERAL
   ========================================================================== */
:root {
    --primary: #1db954;
    --primary-hover: #1ed760;
    --bg: #0d0f10;
    --bg-card: #181c1e;
    --bg-hover: #22272a;
    --text: #f5f7fa;
    --muted: #a0aab4;
    --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* {
    margin: 0;
    padding: 0;
    border: 0;
    box-sizing: border-box;
}

body {
    background-color: #000000;
    font-family: "Inter", sans-serif;
    color: var(--text);
    overflow-x: hidden;
}

/* Selección de Texto Estilo Premium */
::-moz-selection { color: #fff; background: var(--primary); }
::selection { color: #fff; background: var(--primary); }

.sc-truncate[style] {
    display: none !important;
}

/* ==========================================================================
   2. ESTRUCTURA PRINCIPAL (WRAPPER)
   ========================================================================== */
.wrapper {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 20px;
    position: relative;
    top: 40px; /* Reducido de 100px para mejor balance visual */
}

.artist-page {
    background: var(--bg);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.03);
}

/* ==========================================================================
   3. PORTADA DEL ARTISTA (HERO COVER)
   ========================================================================== */
.artist-cover {
    position: relative;
    height: 320px; /* Más espacioso para lucir premium */
    background: linear-gradient(180deg, rgba(13,15,16,0.2) 0%, rgba(13,15,16,0.95) 100%), 
                url('https://lh3.googleusercontent.com/d/1_7wMqsRo2wx8rffUg8UGh_cNOhF3-2nu=w1000') center/cover no-repeat;
    display: flex;
    align-items: flex-end;
    padding: 2.5rem;
}

.artist-info {
    display: flex;
    align-items: center;
    gap: 24px;
    width: 100%;
}

.artist-avatar {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid var(--text);
    object-fit: cover;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.artist-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.artist-name {
    font-size: clamp(1.8rem, 4vw, 3.5rem);
    font-weight: 800;
    margin: 0;
    font-family: "Trade Winds", system-ui, sans-serif;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--text);
}

.artist-followers {
    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 500;
}

.btn-follow {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 25px;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-size: 0.85rem;
    transition: var(--transition-smooth);
    box-shadow: 0 6px 20px rgba(29,185,84,0.4);
    width: fit-content;
    margin-top: 4px;
}

.btn-follow:hover {
    transform: scale(1.03) translateY(-1px);
    box-shadow: 0 8px 24px rgba(29,185,84,0.6);
}

/* ==========================================================================
   4. LISTADO DE MÚSICA (TRACKLIST)
   ========================================================================== */
.music-list {
    padding: 2.5rem;
}

.music-list h2 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    letter-spacing: -0.01em;
}

.music-list ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.music-list li {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    background: transparent;
    border-radius: 8px;
    transition: var(--transition-smooth);
    border-bottom: 1px solid rgba(255,255,255,0.04);
}

.music-list li:hover {
    background: var(--bg-card);
    border-bottom-color: transparent;
}

/* Textos de la Canción */
.track-details {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.song-title {
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--text);
}

.song-info {
    font-size: 0.85rem;
    color: var(--muted);
}

/* Contenedor de Acciones / Botones en Línea */
.track-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

/* ==========================================================================
   5. COMPONENTES DEL REPRODUCTOR Y BOTONES
   ========================================================================== */
.icon { 
    width: 20px; 
    height: 20px; 
    fill: currentColor; 
}

/* Botones Circulares Premium Unificados */
.play-btn, .download-btn, .share-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    transition: var(--transition-smooth);
    text-decoration: none;
    color: #fff;
}

.play-btn {
    background: var(--primary);
    color: #000;
}
.play-btn:hover {
    background: var(--primary-hover);
    transform: scale(1.08);
}
.play-btn.is-playing {
    background: #14b866;
}

.download-btn {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    box-shadow: 0 4px 12px rgba(99,102,241,0.3);
}
.download-btn:hover {
    box-shadow: 0 6px 16px rgba(99,102,241,0.5);
    transform: scale(1.08);
}

.share-btn {
    background: linear-gradient(135deg, #06b6d4, #0ea5e9);
    box-shadow: 0 4px 12px rgba(14,165,233,0.3);
}
.share-btn:hover {
    box-shadow: 0 6px 16px rgba(14,165,233,0.5);
    transform: scale(1.08);
}

/* Ecualizador de Ondas Animadas */
.equalizer {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    width: 24px;
    height: 20px;
    margin-left: 8px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease;
}

.equalizer span {
    display: block;
    width: 3px;
    height: 4px;
    background: var(--primary);
    border-radius: 2px;
}

.equalizer.active {
    opacity: 1;
    visibility: visible;
}

.equalizer.active span {
    animation: bounce 0.8s infinite ease-in-out;
}

.equalizer span:nth-child(1) { animation-delay: 0s; }
.equalizer span:nth-child(2) { animation-delay: 0.15s; }
.equalizer span:nth-child(3) { animation-delay: 0.3s; }
.equalizer span:nth-child(4) { animation-delay: 0.45s; }

@keyframes bounce {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(4); transform-origin: bottom; }
}

/* Controles de Progreso Integrados en las pistas */
.player-controls {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    max-width: 300px;
}

.progress {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    height: 5px;
    border-radius: 3px;
    background: #282828;
    cursor: pointer;
    outline: none;
}

.progress::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    transition: transform 0.1s ease;
}

.progress:hover::-webkit-slider-thumb {
    transform: scale(1.2);
}

.time-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--muted);
}

/* Notificación Flotante (Tooltip de Compartir) */
.tooltip {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #0ea5e9;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    z-index: 1000;
    animation: fadeInOut 2.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
}

@keyframes fadeInOut {
    0% { opacity: 0; transform: translateY(15px); }
    15% { opacity: 1; transform: translateY(0); }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-10px); }
}

/* ==========================================================================
   6. RESPONSIVE DESIGN (MEDIA QUERIES)
   ========================================================================== */

/* Tablets e Interfaces Medianas */
@media only screen and (max-width: 1200px) {
    .wrapper {
        top: 0;
        padding: 20px 12px;
    }
}

/* Celulares (Solución definitiva al desajuste de listas) */
@media (max-width: 768px) {
    .artist-cover {
        height: auto;
        padding: 2rem 1.5rem;
    }

    .artist-info {
        flex-direction: column;
        text-align: center;
        gap: 16px;
    }

    .artist-meta {
        align-items: center;
    }

    .btn-follow {
        margin: 8px auto 0 auto;
    }

    .music-list {
        padding: 1.5rem 1rem;
    }

    /* Cambio Premium: La fila pasa a ser un bloque vertical ordenado */
    .music-list li {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .track-details {
        width: 100%;
    }

    /* Distribuye los botones equitativamente a lo ancho de la pantalla móvil */
    .track-actions {
        width: 100%;
        justify-content: flex-start;
        gap: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 12px;
    }

    .player-controls {
        max-width: 100%; /* El deslizador toma todo el ancho en móvil */
    }

    .progress {
        width: 100% !important; /* Forza la barra rota a ser responsive */
    }

    .equalizer {
        margin-left: auto; /* Mantiene el ecualizador alineado a la derecha */
    }
}

@media only screen and (max-width: 430px) {
    .artist-avatar {
        width: 100px;
        height: 100px;
    }
}

    </style>

<script src="src/components/Header/header.js" defer></script>

<script>
  // Reproductor único oculto
  const player = document.getElementById('player');
  let activeLi = null; // referencia al <li> que está sonando

  // Formatear segundos a mm:ss
  function formatTime(seconds) {
    if (!isFinite(seconds) || seconds < 0) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  // Resetear visuales en todas las canciones
  function resetAllVisuals(exceptLi) {
    document.querySelectorAll('.music-list li').forEach(li => {
      const btn = li.querySelector('.play-btn');
      const eq = li.querySelector('.equalizer');
      const progress = li.querySelector('.progress');
      const currentEl = li.querySelector('.current-time');

      if (btn) {
        btn.querySelector('.icon-play').style.display = 'block';
        btn.querySelector('.icon-pause').style.display = 'none';
      }
      if (eq) eq.classList.remove('active');
      if (li !== exceptLi) {
        if (progress) progress.value = 0;
        if (currentEl) currentEl.textContent = '0:00';
      }
    });
  }

  // Click en cada botón de reproducción
  document.querySelectorAll('.play-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const li = btn.closest('li');
      const src = btn.getAttribute('data-src');
      if (!src || !li) return;

      const playIcon = btn.querySelector('.icon-play');
      const pauseIcon = btn.querySelector('.icon-pause');
      const eq = li.querySelector('.equalizer');
      const progress = li.querySelector('.progress');
      const currentEl = li.querySelector('.current-time');
      const totalEl = li.querySelector('.total-time');

      const sameTrack = player.src && player.src.includes(src);

      // Pausar si es la misma pista y está sonando
      if (sameTrack && !player.paused) {
        player.pause();
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        eq.classList.remove('active');
        return;
      }

      // Cambiar de pista
      if (!sameTrack) {
        player.src = src;
      }

      try {
        await player.play();
        activeLi = li; // guardar cuál está activa

        // Resetear otros botones
        resetAllVisuals(li);

        // Activar actual
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        eq.classList.add('active');

        // Duración total
        player.addEventListener('loadedmetadata', () => {
          if (progress) progress.max = Math.floor(player.duration);
          if (totalEl) totalEl.textContent = formatTime(player.duration);
        });

        // Scrubbing
        if (progress) {
          progress.oninput = () => {
            const val = Number(progress.value);
            if (isFinite(val)) player.currentTime = val;
          };
        }

      } catch (err) {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        eq.classList.remove('active');
        console.warn('No se pudo reproducir:', err);
      }
    });
  });

  // Actualizar solo la barra del li activo
  player.addEventListener('timeupdate', () => {
    if (!activeLi) return;
    const progress = activeLi.querySelector('.progress');
    const currentEl = activeLi.querySelector('.current-time');
    if (progress) progress.value = Math.floor(player.currentTime);
    if (currentEl) currentEl.textContent = formatTime(player.currentTime);
  });

  // Reset al terminar
  player.addEventListener('ended', () => {
    if (!activeLi) return;
    const btn = activeLi.querySelector('.play-btn');
    const eq = activeLi.querySelector('.equalizer');
    const progress = activeLi.querySelector('.progress');
    const currentEl = activeLi.querySelector('.current-time');
    btn.querySelector('.icon-play').style.display = 'block';
    btn.querySelector('.icon-pause').style.display = 'none';
    eq.classList.remove('active');
    if (progress) progress.value = 0;
    if (currentEl) currentEl.textContent = '0:00';
    activeLi = null;
  });

  // Compartir
  document.querySelectorAll('.share-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const link = btn.getAttribute('data-link');
      if (!link) return;

      if (navigator.share) {
        try {
          await navigator.share({ title: 'Escucha esta canción', url: link });
        } catch (e) {
          console.log('Compartir cancelado o falló:', e);
        }
      } else {
        try {
          await navigator.clipboard.writeText(link);
          const tip = document.createElement('div');
          tip.className = 'tooltip';
          tip.textContent = 'Enlace copiado ✔';
          document.body.appendChild(tip);
          setTimeout(() => tip.remove(), 1800);
        } catch (e) {
          console.error('No se pudo copiar el enlace:', e);
        }
      }
    });
  });
   
</script>
  </body>
</html>
