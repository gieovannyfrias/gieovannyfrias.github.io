<body>

  <div class="error-container">
    <!-- Efecto de luces de fondo -->
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>

    <!-- Tarjeta Principal con Efecto Cristal -->
    <div class="error-card">
      <div class="icon-wrapper">
        <div class="radar-pulse"></div>
        <span class="lock-icon">🔒</span>
      </div>

      <h1 class="error-title">No Disponible</h1>
      <p class="error-description">
        La página o el recurso al que intentas acceder está restringido, requiere una suscripción activa o ya no se encuentra en línea.
      </p>

      <!-- Caja de estado/detalles rápidos -->
      <div class="status-box">
        <div class="status-item">
          <span class="status-label">Código de Estado</span>
          <span class="status-value highlight">403 Restringuido</span>
        </div>
        <div class="status-item">
          <span class="status-label">Nivel de Acceso</span>
          <span class="status-value">Denegado</span>
        </div>
      </div>

      <!-- Botones de Acción de Alta Conversión -->
      <div class="action-group">
        <button class="btn-primary" onclick="window.location.href='/Contacto'">
          <i>⬅</i> Volver Atrás
        </button>
       <button class="btn-secondary" onclick="window.location.href='https://www.gieovannyfrias.com'">
          <i>🏠</i> Ir al Inicio
          </button>
      </div>

      <div class="error-footer">
        <p>¿Crees que esto es un error? <a href="/Contactos">Contactar a Soporte</a></p>
      </div>
    </div>
  </div>
<style>
  /* ==========================================================================
   DISEÑO PREMIUM PARA PÁGINA "CONTENIDO NO DISPONIBLE"
   ========================================================================== */
:root {
  --bg-dark: #070d12;
  --bg-card: rgba(23, 32, 42, 0.45);
  --text-main: #f0f4f8;
  --text-muted: #8e9ca8;
  --neon-cyan: #00aff0;
  --neon-purple: #8a2be2;
  --gradient-premium: linear-gradient(135deg, #00aff0 0%, #7b2cbf 100%);
  --border-glass: 1px solid rgba(255, 255, 255, 0.07);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  zoom:75%;
}

/* Contenedor con Posicionamiento Aislado */
.error-container {
  position: relative;
  width: 100%;
  max-width: 480px;
  padding: 20px;
  z-index: 2;
}

/* Esferas de luz ambiental trasera (Neon Glow) */
.glow-sphere {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.25;
  z-index: -1;
  pointer-events: none;
}
.sphere-1 {
  width: 250px;
  height: 250px;
  background: var(--neon-cyan);
  top: -40px;
  left: -20px;
  animation: floatAmbient 6s ease-in-out infinite alternate;
}
.sphere-2 {
  width: 300px;
  height: 300px;
  background: var(--neon-purple);
  bottom: -60px;
  right: -40px;
  animation: floatAmbient 8s ease-in-out infinite alternate-reverse;
}

@keyframes floatAmbient {
  0% { transform: translateY(0) scale(1); }
  100% { transform: translateY(20px) scale(1.1); }
}

/* Tarjeta con Glassmorphism Real */
.error-card {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: var(--border-glass);
  border-radius: 24px;
  padding: 40px 32px;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 
              inset 0 1px 1px rgba(255, 255, 255, 0.1);
  animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes cardEntrance {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Iconografía y Efecto Radar */
.icon-wrapper {
  position: relative;
  width: 76px;
  height: 76px;
  margin: 0 auto 24px auto;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.lock-icon {
  font-size: 26px;
  z-index: 2;
}

.radar-pulse {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--neon-cyan);
  opacity: 0.15;
  animation: pulseRadar 2s infinite ease-out;
}

@keyframes pulseRadar {
  0% { transform: scale(1); opacity: 0.3; }
  100% { transform: scale(1.7); opacity: 0; }
}

/* Tipografía */
.error-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 12px;
  background: linear-gradient(180deg, #ffffff 0%, #bdc7d0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.error-description {
  color: var(--text-muted);
  font-size: 14.5px;
  line-height: 1.6;
  margin-bottom: 28px;
}

/* Bloque de Metadatos de Estado */
.status-box {
  background: rgba(0, 0, 0, 0.2);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 28px;
  border: 1px solid rgba(255, 255, 255, 0.02);
}

.status-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 13px;
}
.status-item:not(:last-child) {
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  padding-bottom: 10px;
  margin-bottom: 4px;
}

.status-label {
  color: var(--text-muted);
}

.status-value {
  font-weight: 600;
}
.status-value.highlight {
  color: var(--neon-cyan);
}

/* Botones con Microinteracciones */
.action-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}

.btn-primary, .btn-secondary {
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.25s ease;
}

.btn-primary {
  background: var(--gradient-premium);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(0, 175, 240, 0.25);
}
.btn-primary:hover {
  transform: translateY(-1.5px);
  box-shadow: 0 6px 20px rgba(0, 175, 240, 0.4);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  border: 1px solid rgba(255, 255, 255, 0.05);
}
.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.1);
}

.btn-primary:active, .btn-secondary:active {
  transform: translateY(0);
}

/* Footer de la tarjeta */
.error-footer {
  font-size: 12.5px;
  color: var(--text-muted);
}

.error-footer a {
  color: var(--neon-cyan);
  text-decoration: none;
  font-weight: 600;
  transition: opacity 0.2s ease;
}
.error-footer a:hover {
  text-decoration: underline;
  opacity: 0.9;
}

/* Adaptabilidad Móvil Extrema */
@media (max-width: 480px) {
  .error-card {
    padding: 32px 20px;
  }
  .error-title {
    font-size: 21px;
  }
  .error-description {
    font-size: 13.5px;
  }
}

  </style>
</body>
</html>
